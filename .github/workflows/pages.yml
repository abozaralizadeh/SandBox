name: Pages

# Builds the seven pages from templates/ and static/ and deploys them to GitHub Pages.
# The data they fetch comes from the Cloudflare Worker in worker/, not from here.

on:
  push:
    branches: [main]
    paths:
      - "templates/**"
      - "static/**"
      - "scripts/build_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "flask>=3"
      - name: Render pages
        env:
          HIDE_TRAIDE_PAGE: ${{ vars.HIDE_TRAIDE_PAGE || 'true' }}
          AIOPS_DEFAULT_PROBLEM: ${{ vars.AIOPS_DEFAULT_PROBLEM || 'Riemann Hypothesis' }}
        run: python scripts/build_site.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
